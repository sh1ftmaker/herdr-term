# Copy to config.yml and fill in your own tunnel. The real config.yml is
# gitignored because it names the tunnel and hostname of a specific machine.
#
#   cloudflared tunnel create <name>
#   cloudflared tunnel route dns <name> <hostname>
#
# Put the bridge behind Cloudflare Access (an email allowlist is enough) --
# it relays keystrokes into a live shell and serves files from $HOME, so the
# edge policy is the only thing in front of it.
tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: /home/<user>/.cloudflared/<tunnel-name>.json

ingress:
  - hostname: terminal.example.com
    service: http://127.0.0.1:8790
    originRequest:
      # Terminal frames stream over a long-lived WebSocket.
      noTLSVerify: false
      connectTimeout: 10s
  - service: http_status:404
